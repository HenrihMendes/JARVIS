  <div id="root" data-composition-id="fundo" data-width="1080" data-height="1920">

  <script>
    (function () {
      // PRNG determinístico (mulberry32)
      function rng(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const r = rng(7);
      const D = 15;
      const tl = gsap.timeline({ paused: true });

      // Chama viva: 30 ciclos de 0,5 s, valores de semente fixa
      gsap.set("#fundo-chama", { svgOrigin: "440 168" });
      for (let i = 0; i < 30; i++) {
        tl.to(
          "#fundo-chama",
          { scaleY: 0.9 + 0.2 * r(), scaleX: 0.94 + 0.1 * r(), skewX: -5 + 10 * r(), duration: 0.5, ease: "sine.inOut" },
          i * 0.5,
        );
        tl.to("#fundo-luz", { opacity: 0.88 + 0.12 * r(), duration: 0.5, ease: "sine.inOut" }, i * 0.5);
        tl.to("#fundo-halo-chama", { opacity: 0.75 + 0.25 * r(), duration: 0.5, ease: "sine.inOut" }, i * 0.5);
      }

      // Poeira: 16 grãos no cone de luz acima da chama
      const host = document.getElementById("fundo-poeira");
      for (let i = 0; i < 16; i++) {
        const d = document.createElement("div");
        d.className = "fundo-poeira";
        d.id = "fundo-p" + i;
        const size = 3 + Math.round(r() * 4);
        const x = 540 + (r() - 0.5) * 640;
        const y = 820 + r() * 700;
        d.style.width = size + "px";
        d.style.height = size + "px";
        d.style.left = Math.round(x) + "px";
        d.style.top = Math.round(y) + "px";
        host.appendChild(d);
        const rise = 260 + r() * 160;
        const sway = (r() - 0.5) * 60;
        const peak = 0.25 + r() * 0.35;
        tl.fromTo(d, { x: 0, y: 0 }, { x: sway, y: -rise, duration: D, ease: "none" }, 0);
        tl.fromTo(d, { opacity: 0 }, { opacity: peak, duration: 2 + r() * 2, ease: "sine.inOut" }, r() * 3);
        tl.to(d, { opacity: 0, duration: 2.5, ease: "sine.inOut" }, 9 + r() * 3.5);
      }

      window.__timelines["fundo"] = tl;
    })();
  </script>
