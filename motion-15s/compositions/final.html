  <div
    id="root"
    data-composition-id="final"
    data-width="1080"
    data-height="1920"
    data-composition-variables='[
      {"id":"lema","type":"string","label":"Lema","default":"Coisas novas e velhas."},
      {"id":"cta","type":"string","label":"CTA","default":"Siga @escribatv"}
    ]'
  >
    <div id="final-palco">
      <div id="final-sombra-disco"></div>

      <!-- A bulla oficial (borda irregular + anel), o E em relevo por baixo do carimbo -->
      <div id="final-disco">
        <img id="final-disco-base" src="assets/brand/simbolo-disco.svg" alt="" />
        <img id="final-e-sombra" src="assets/brand/simbolo-e-sombra.svg" alt="" />
        <img id="final-e" src="assets/brand/simbolo-e.svg" alt="E da Escriba" />
      </div>

      <div id="final-po" data-layout-ignore></div>

      <div id="final-sombra-carimbo"></div>

      <!-- Carimbo de madeira visto de cima: bloco + pegador -->
      <svg id="final-carimbo" viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg" data-layout-ignore>
        <defs>
          <linearGradient id="final-madeira" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5e3a20" />
            <stop offset="0.5" stop-color="#8a5a34" />
            <stop offset="1" stop-color="#5a361c" />
          </linearGradient>
          <radialGradient id="final-pegador" cx="0.45" cy="0.4" r="0.6">
            <stop offset="0" stop-color="#a7754a" />
            <stop offset="0.7" stop-color="#7a4c2a" />
            <stop offset="1" stop-color="#5a361c" />
          </radialGradient>
        </defs>
        <!-- lateral do bloco (espessura da madeira) -->
        <rect x="12" y="40" width="416" height="392" rx="44" fill="#3f2614" />
        <rect x="12" y="380" width="416" height="44" rx="20" fill="#5a361c" />
        <!-- face de cima do bloco -->
        <rect x="12" y="8" width="416" height="392" rx="44" fill="url(#final-madeira)" />
        <rect x="32" y="28" width="376" height="352" rx="32" fill="none" stroke="#a7754a" stroke-width="5" opacity="0.5" />
        <g stroke="#3f2614" stroke-width="3" fill="none" opacity="0.35" stroke-linecap="round">
          <path d="M44,74 C140,58 300,96 396,70" />
          <path d="M44,128 C150,112 290,148 396,128" />
          <path d="M44,300 C140,284 300,318 396,294" />
          <path d="M44,350 C150,338 290,370 396,352" />
        </g>
        <!-- pegador elevado: sombra projetada, lateral e topo -->
        <ellipse cx="226" cy="236" rx="120" ry="112" fill="#24150a" opacity="0.55" />
        <ellipse cx="220" cy="222" rx="108" ry="104" fill="#4a2c18" />
        <ellipse cx="220" cy="200" rx="108" ry="100" fill="url(#final-pegador)" />
        <g stroke="#5a361c" stroke-width="3" fill="none" opacity="0.5">
          <ellipse cx="220" cy="200" rx="78" ry="72" />
          <ellipse cx="220" cy="200" rx="48" ry="44" />
          <ellipse cx="220" cy="200" rx="18" ry="16" />
        </g>
        <!-- luz quente da lamparina batendo na quina de baixo -->

      <div id="final-nome" aria-label="ESCRIBA">
        <span>E</span><span>S</span><span>C</span><span>R</span><span>I</span><span>B</span><span>A</span>
      </div>
      <div id="final-lema" data-var-text="lema">Coisas novas e velhas.</div>
      <div id="final-cta" data-var-text="cta">Siga @escribatv</div>
    </div>
  </div>

  <script>
    (function () {
      function rng(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const r = rng(52);
      const tl = gsap.timeline({ paused: true });
      const IMPACTO = 0.55; // 11,35 s absoluto

      // A bulla chega (recebe os 4 selos que convergiram).
      tl.fromTo(
        "#final-disco",
        { scale: 0.55, filter: "blur(6px)", transformOrigin: "50% 50%" },
        { scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" },
        0,
      );
      // opacidade chega antes da escala: sem quadro vazio no corte com os selos
      tl.fromTo("#final-disco", { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "none" }, 0);
      tl.fromTo("#final-sombra-disco", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.05);

      // O carimbo desce em direção à argila (vem da câmera, acelerando).
      tl.fromTo(
        "#final-carimbo",
        { opacity: 0, scale: 2.4, filter: "blur(12px)", transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: IMPACTO - 0.15, ease: "power3.in" },
        0.15,
      );
      tl.fromTo(
        "#final-sombra-carimbo",
        { opacity: 0, scale: 1.6, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: IMPACTO - 0.15, ease: "power3.in" },
        0.15,
      );

      // Impacto: a argila cede, o palco treme, o E fica gravado por baixo.
      tl.set("#final-e", { opacity: 1 }, IMPACTO);
      tl.set("#final-e-sombra", { opacity: 0.55 }, IMPACTO);
      tl.fromTo("#final-disco", { scale: 1 }, { scale: 0.96, duration: 0.05, ease: "power2.out", immediateRender: false }, IMPACTO);
      tl.to("#final-disco", { scale: 1, duration: 0.3, ease: "back.out(1.6)" }, IMPACTO + 0.05);
      tl.fromTo("#final-carimbo", { scale: 1 }, { scale: 0.985, duration: 0.05, ease: "power2.out", immediateRender: false }, IMPACTO);
      tl.to("#final-carimbo", { scale: 1, duration: 0.2, ease: "power2.out" }, IMPACTO + 0.05);
      tl.fromTo("#final-palco", { y: 0 }, { y: 7, duration: 0.04, ease: "power2.out", immediateRender: false }, IMPACTO);
      tl.to("#final-palco", { y: 0, duration: 0.25, ease: "power2.out" }, IMPACTO + 0.04);

      // Poeira de argila espirrando da borda.
      const po = document.getElementById("final-po");
      for (let i = 0; i < 14; i++) {
        const d = document.createElement("div");
        d.className = "final-po";
        d.id = "final-po-" + i;
        const a = (i / 14) * Math.PI * 2 + r() * 0.35;
        const size = 5 + Math.round(r() * 7);
        d.style.width = size + "px";
        d.style.height = size + "px";
        d.style.left = Math.round(540 + Math.cos(a) * 190 - size / 2) + "px";
        d.style.top = Math.round(650 + Math.sin(a) * 190 - size / 2) + "px";
        d.style.background = r() > 0.5 ? "#b5532c" : "#7a3a1e";
        po.appendChild(d);
        const dist = 50 + r() * 90;
        tl.fromTo(d, { opacity: 0, x: 0, y: 0 }, { opacity: 0.9, duration: 0.04, ease: "none" }, IMPACTO);
        tl.to(d, { x: Math.cos(a) * dist, y: Math.sin(a) * dist + 20, duration: 0.6, ease: "power2.out" }, IMPACTO);
        tl.to(d, { opacity: 0, duration: 0.35, ease: "power2.in" }, IMPACTO + 0.3);
      }

      // O carimbo sobe (sai rumo à câmera, acelerando) e revela o E.
      tl.to("#final-carimbo", { scale: 1.9, opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power3.in" }, 0.95);
      tl.to("#final-sombra-carimbo", { opacity: 0, scale: 1.5, duration: 0.4, ease: "power3.in" }, 0.95);

      // ESCRIBA, letra a letra.
      tl.fromTo(
        "#final-nome span",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out", stagger: 0.08 },
        1.25,
      );

      // Lema: a linha inteira entra com blur 8 -> 0.
      tl.fromTo("#final-lema", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 1.65);

      // CTA: carimbado como os selos.
      tl.fromTo(
        "#final-cta",
        { opacity: 0, scale: 1.3, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 0.96, duration: 0.12, ease: "power3.in" },
        2.0,
      );
      tl.to("#final-cta", { scale: 1, duration: 0.24, ease: "back.out(1.6)" }, 2.12);

      window.__timelines["final"] = tl;
    })();
  </script>
