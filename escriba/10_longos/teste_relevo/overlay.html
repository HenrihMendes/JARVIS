<!doctype html>
<html><head><meta charset="utf-8"><title>Escriba — camada gráfica 16:9</title>
<style>
@font-face{font-family:"Fraunces";font-weight:900;src:url(node_modules/@fontsource/fraunces/files/fraunces-latin-900-normal.woff2) format("woff2");}
@font-face{font-family:"Archivo";font-weight:800;src:url(node_modules/@fontsource/archivo/files/archivo-latin-800-normal.woff2) format("woff2");}
@font-face{font-family:"Archivo";font-weight:700;src:url(node_modules/@fontsource/archivo/files/archivo-latin-700-normal.woff2) format("woff2");}
@font-face{font-family:"IBM Plex Mono";font-weight:600;src:url(node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2) format("woff2");}
@font-face{font-family:"Noto Sans Phoenician";src:url(node_modules/@fontsource/noto-sans-phoenician/files/noto-sans-phoenician-phoenician-400-normal.woff2) format("woff2");}
:root{--lapis:#1D2A4D;--lapis2:#141D36;--barro:#B5532C;--papiro:#F1E6D2;--lamp:#E2A43A;--oliva:#7C8250;--carvao:#1B1714;--lapisc:#3B5BA9}
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
.el{position:absolute;opacity:0;transform-origin:left center}
#bug{right:64px;top:46px;display:flex;align-items:center;gap:12px;opacity:.85}
#bug span{font:600 22px "IBM Plex Mono";color:var(--papiro);letter-spacing:.06em;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#serie{left:64px;top:46px;display:flex;align-items:center;gap:12px;background:rgba(20,29,54,.78);padding:10px 20px 10px 16px;border-radius:999px}
#serie i{width:12px;height:12px;border-radius:50%;background:var(--barro);display:block}
#serie b{font:800 20px "Archivo";letter-spacing:.14em;color:var(--papiro)}
#etiq{left:64px;bottom:150px;font:600 24px "IBM Plex Mono";letter-spacing:.12em;color:var(--papiro);background:rgba(14,20,40,.84);padding:12px 22px;border-left:6px solid var(--barro)}
.selo{left:64px;top:112px;display:flex;align-items:center;gap:16px;background:rgba(20,29,54,.82);padding:10px 26px 10px 10px;border-radius:999px;max-width:1100px}
.selo .t{display:flex;flex-direction:column;gap:2px}
.selo .t small{font:600 18px "IBM Plex Mono";letter-spacing:.2em}
.selo .t span{font:700 26px "Archivo";color:var(--papiro)}
#card{left:50%;top:735px;transform-origin:center;display:flex;align-items:center;gap:28px;background:rgba(10,14,28,.86);padding:18px 36px;border-radius:14px;border:1px solid rgba(226,164,58,.35)}
#card .fen{font:64px "Noto Sans Phoenician";color:var(--lamp);direction:rtl}
#card .mono{font:600 26px "IBM Plex Mono";color:var(--papiro);opacity:.8;letter-spacing:.1em}
#card .eq{font:900 52px "Fraunces";color:var(--papiro)}
#card .eq em{font-style:normal;color:var(--lamp)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <!-- bulla: borda irregular de argila -->
  <path id="bulla" d="M50 3 C64 2 77 8 86 18 C95 28 98 41 97 53 C96 67 89 80 78 88 C67 96 53 98 40 96 C27 94 15 86 9 74 C3 62 2 48 6 36 C10 23 20 12 32 7 C38 4 44 3 50 3 Z"/>
</defs></svg>
<div id="bug" class="el"><svg width="48" height="48" viewBox="0 0 100 100"><use href="#bulla" fill="#B5532C"/><circle cx="50" cy="50" r="38" fill="none" stroke="#F1E6D2" stroke-width="2.5" opacity=".8"/>
  <path d="M38 24 L38 76" stroke="#F1E6D2" stroke-width="7" stroke-linecap="round"/><path d="M38 76 L34 84" stroke="#F1E6D2" stroke-width="3"/>
  <path d="M42 30 L66 28 L70 24" stroke="#F1E6D2" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M42 50 L60 49 L64 45" stroke="#F1E6D2" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M42 70 L66 69 L70 65" stroke="#F1E6D2" stroke-width="6" fill="none" stroke-linecap="round"/></svg><span>@escribatv.oficial</span></div>
<div id="serie" class="el"><i></i><b>DEBAIXO DA TERRA · O CASO DAVI</b></div>
<div id="etiq" class="el">ARAM-DAMASCO · c. 840 a.C.</div>
<div id="selo" class="el selo"><svg id="seloIco" width="72" height="72" viewBox="0 0 100 100"></svg><div class="t"><small id="seloLab"></small><span id="seloTxt"></span></div></div>
<div id="card" class="el"><span class="fen">&#x10901;&#x10909;&#x10915;&#x10903;&#x10905;&#x10903;</span><span class="mono">bytdwd</span><span class="eq">= CASA DE <em>DAVI</em></span></div>
<script>
const ICON = {
  TEXTO: '<path d="M30 30 h40 a6 6 0 0 1 0 12 h-40 a6 6 0 0 1 0 -12 Z M30 58 h40 a6 6 0 0 1 0 12 h-40 a6 6 0 0 1 0 -12 Z M30 36 v28 M70 36 v28" fill="none" stroke="#F1E6D2" stroke-width="5"/><path d="M38 47 h24 M38 53 h18" stroke="#F1E6D2" stroke-width="3.5"/>',
  ACHADO: '<path d="M50 22 L64 48 L50 58 L36 48 Z" fill="#F1E6D2"/><path d="M50 58 L50 70" stroke="#F1E6D2" stroke-width="5"/><rect x="44" y="70" width="12" height="16" rx="4" fill="#F1E6D2"/>',
  LEITURA: '<path d="M20 50 C32 32 68 32 80 50 C68 68 32 68 20 50 Z" fill="none" stroke="#F1E6D2" stroke-width="5"/><circle cx="50" cy="50" r="10" fill="#F1E6D2"/>',
  'RECRIAÇÃO': '<path d="M68 22 L74 28 L48 58 L42 52 Z" fill="#1B1714"/><path d="M42 52 L48 58 C46 70 36 76 26 76 C30 68 32 58 42 52 Z" fill="#1B1714"/>',
};
const COR = { TEXTO: '#3B5BA9', ACHADO: '#B5532C', LEITURA: '#7C8250', 'RECRIAÇÃO': '#E2A43A' };
const SELOS = [
  [1.6, 6.6, 'RECRIAÇÃO', 'Cenas e personagens são reconstruções artísticas'],
  [8.6, 12.4, 'TEXTO', '2 Reis 8:15 · Hazael toma o trono'],
  [13.1, 17.3, 'TEXTO', '2 Reis 10:32 · 2 Reis 12:17-18'],
  [18.0, 21.6, 'LEITURA', 'Autor provável: Hazael · o nome não foi preservado'],
  [22.3, 27.0, 'ACHADO', 'Estela de Tel Dan · c. 840 a.C. · Museu de Israel'],
];
const FPS = 24, F = (t) => Math.round(t * FPS);
function vis(T, a, b, fade = 1 / 6) { if (T < a || T >= b) return 0; return Math.min(1, (T - a) / fade, (b - T) / fade); }
function stampScale(T, a) { const k = F(T) - F(a); return [1.22, 1.12, 1.04][k] ?? 1; }
window.setState = (T) => {
  const st = [];
  const set = (id, o, s = 1, extra = '') => { const e = document.getElementById(id); e.style.opacity = o.toFixed(3); e.style.transform = (id === 'card' ? 'translateX(-50%) ' : '') + `scale(${s})`; st.push(id + o.toFixed(2) + s + extra); };
  set('bug', 0.85 * vis(T, 0.0, 35.4, 0.4));
  set('serie', vis(T, 0.4, 6.5, 0.25));
  set('etiq', vis(T, 1.0, 7.7, 0.25));
  const s = SELOS.find(x => T >= x[0] && T < x[1]);
  if (s) { document.getElementById('seloIco').innerHTML = `<use href="#bulla" fill="${COR[s[2]]}"/>` + ICON[s[2]]; const lab = document.getElementById('seloLab'); lab.textContent = s[2]; lab.style.color = s[2] === 'RECRIAÇÃO' ? '#E2A43A' : COR[s[2]] === '#3B5BA9' ? '#8AA2E8' : COR[s[2]] === '#7C8250' ? '#B9C07A' : '#E08A60';
    document.getElementById('seloTxt').textContent = s[3]; set('selo', vis(T, s[0], s[1], 0.12), stampScale(T, s[0]), s[2]); } else set('selo', 0);
  set('card', vis(T, 29.2, 31.25, 0.2), F(T) - F(29.2) < 3 && T >= 29.2 ? [0.94, 0.98, 1.0][F(T) - F(29.2)] : 1);
  return st.join('|');
};
document.fonts.ready.then(() => { window.ready = true; });
</script></body></html>
