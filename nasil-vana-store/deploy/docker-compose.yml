# Produção em VPS: PostgreSQL + loja + Caddy (HTTPS automático via Let's Encrypt).
#   cp ../.env.example ../.env  (preencha)  →  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nasil
      POSTGRES_USER: nasil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nasil"], interval: 10s, retries: 5 }
    # Sem "ports": o banco NÃO fica exposto à internet.

  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://nasil:${POSTGRES_PASSWORD}@db:5432/nasil
      STORAGE_LOCAL_DIR: /app/storage
    volumes: [media:/app/storage]
    depends_on: { db: { condition: service_healthy } }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]
    depends_on: [app]

volumes: { pgdata: {}, media: {}, caddy_data: {} }
